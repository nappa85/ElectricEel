name: CI

# Runs the real quality gates on every push and pull request, independent of
# the release packaging workflow (release.yml builds/checks/publishes the RPM).
# Gates mirror the local dev commands:
#   Rust : cargo fmt --check, clippy -D warnings (all targets AND the shipped
#          `app-entry` feature set), cargo test, committed C header in sync
#   FFI  : host-built Go libteslable.so + ignored Rust<->Go integration tests
#          + C ABI smoke test
#   Go   : gofmt, go vet, go test -race (session + patched vehicle-command)
#   QML  : qmllint syntax over app/qml, Qt C++ regression tests, node tests
#   i18n : tools/build-qm.sh --check (catalogs in sync)
#   RPM  : mb2 build, mb2 check --suites harbour, Qt tests under the SDK target
#
# Toolchains are pinned: Rust by helper/rust-toolchain.toml, Go by
# helper/session/go.mod, the Sailfish SDK image by digest, actions by SHA.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single pin for this workflow; keep in sync with release.yml, build.sh and
  # helper/build-go-library-sdk.sh (tag 5.2.0.15 == the mb2 target below).
  SAILFISH_SDK_IMAGE: coderus/sailfishos-platform-sdk-aarch64:5.2.0.15@sha256:e5f7596d14502746b308c3dde36f65fc25d7f76c45a01acaed56a1f55b76f592
  SAILFISH_TARGET: SailfishOS-5.2.0.15-aarch64

jobs:
  rust:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (helper/rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy on the shipped feature set (what make-app-bundle.sh builds)
        run: cargo clippy --locked --lib --features app-entry -- -D warnings
      - run: cargo test --locked --all-features
      - name: Committed C header matches the cbindgen output
        # build.rs regenerates helper/electriceelcore.h on every build; the
        # committed copy is what the app compiles against.
        run: git diff --exit-code -- electriceelcore.h

  ffi:
    name: Rust/Go FFI integration (host libteslable.so, C smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helper/session/go.mod
          cache-dependency-path: helper/session/go.sum
      - name: Install the pinned Rust toolchain (helper/rust-toolchain.toml)
        working-directory: helper
        run: rustup toolchain install
      - name: Build the Go protocol library for the host
        run: |
          mkdir -p "$RUNNER_TEMP/teslable"
          CC=gcc GOEXPERIMENT=cgocheck2 bash helper/session/build-library.sh "$RUNNER_TEMP/teslable/libteslable.so"
      - name: Rust integration tests against the real Go library
        env:
          TESLA_BLE_TEST_LIBRARY: ${{ runner.temp }}/teslable/libteslable.so
        run: cargo test --locked --manifest-path helper/Cargo.toml --lib --features runtime -- --include-ignored
      - name: C ABI smoke test
        working-directory: helper/session
        run: |
          gcc -Wall -Wextra -Werror -I abi abi/smoke.c \
            -L "$RUNNER_TEMP/teslable" -lteslable -Wl,-rpath,"$RUNNER_TEMP/teslable" \
            -pthread -o "$RUNNER_TEMP/teslable-smoke"
          "$RUNNER_TEMP/teslable-smoke"

  go:
    name: Go session (gofmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper/session
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helper/session/go.mod
          cache-dependency-path: |
            helper/session/go.sum
            helper/session/thirdparty/vehicle-command/go.sum
      - name: Enforce Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Patched vendored vehicle-command module
        # Separate Go module (own go.mod), so `go test ./...` above never
        # enters it; this covers the local patches (navigation_ee.go etc.,
        # docs/vehicle-command-patch.md).
        working-directory: helper/session/thirdparty/vehicle-command
        run: go test ./...

  qml:
    name: QML lint and Qt C++ host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Qt QML tools
        run: sudo apt-get update && sudo apt-get install -y qtdeclarative5-dev-tools qtbase5-dev
      - name: qmllint syntax check
        # Qt 5.15 qmllint is a pure syntax verifier: it parses QML with
        # QQmlJS and never resolves imports, so the Sailfish-only modules
        # (Sailfish.Silica, Sailfish.Share, Nemo.*) cannot cause false
        # positives. Non-zero exit means a real syntax error.
        run: |
          export PATH="$PATH:/usr/lib/qt5/bin:/usr/lib/x86_64-linux-gnu/qt5/bin"
          command -v qmllint
          qmllint app/qml/harbour-electric-eel.qml app/qml/PhoneKeyEvents.qml app/qml/cover/*.qml app/qml/pages/*.qml
      - name: Qt command argument regression tests
        run: |
          g++ -std=c++11 -fPIC $(pkg-config --cflags Qt5Core) \
            app/tests/commandarguments_test.cpp -o "$RUNNER_TEMP/commandarguments_test" \
            $(pkg-config --libs Qt5Core)
          "$RUNNER_TEMP/commandarguments_test"
      - name: Qt configuration admission regression test
        run: |
          /usr/lib/qt5/bin/moc app/src/teslaclient.h -o "$RUNNER_TEMP/moc_teslaclient.cpp"
          g++ -std=c++11 -fPIC -DAPP_VERSION=\"test\" \
            -Iapp/tests/runtime_stub $(pkg-config --cflags Qt5Core Qt5Gui) \
            app/tests/configload_test.cpp app/src/teslaclient.cpp "$RUNNER_TEMP/moc_teslaclient.cpp" \
            -o "$RUNNER_TEMP/configload_test" $(pkg-config --libs Qt5Core Qt5Gui)
          "$RUNNER_TEMP/configload_test"

  qml-logic:
    name: QML JavaScript logic and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test app/tests/*_test.cjs

  i18n:
    name: Translations freshness (lupdate/lrelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Rebuild catalogs and fail on drift
        # tools/build-qm.sh bootstraps pinned Qt linguist tools from the
        # PySide6-Essentials wheel (no system Qt needed) and fails when the
        # committed app/translations/*.ts/*.qm differ from a fresh
        # extraction, so UI string changes can never ship without catalogs.
        run: bash tools/build-qm.sh --check

  harbour:
    name: RPM build, Harbour validation and SDK Qt tests (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for the Sailfish SDK image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean
          df -h

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helper/session/go.mod
          cache-dependency-path: helper/session/go.sum

      - name: Install the pinned Rust toolchain (helper/rust-toolchain.toml)
        working-directory: helper
        run: rustup toolchain install

      - name: Pull Sailfish Platform SDK
        run: docker pull "$SAILFISH_SDK_IMAGE"

      - name: Stage the in-app core bundle (staticlib + Go protocol library)
        run: ./helper/make-app-bundle.sh

      - name: Build RPM, run Harbour validation and the SDK-target Qt tests
        run: |
          set -euxo pipefail
          docker create --name electric-eel-build "$SAILFISH_SDK_IMAGE" sleep infinity
          trap 'docker rm -f electric-eel-build >/dev/null 2>&1 || true' EXIT
          docker start electric-eel-build

          docker cp app electric-eel-build:/home/mersdk/app
          # rustruntime.pro includes ../../helper/session/abi
          docker exec electric-eel-build mkdir -p /home/mersdk/helper/session
          docker cp helper/session/abi electric-eel-build:/home/mersdk/helper/session/abi
          docker exec -u root electric-eel-build chown -R mersdk:mersdk /home/mersdk/app /home/mersdk/helper
          docker exec -w /home/mersdk/app electric-eel-build \
            mb2 --target "$SAILFISH_TARGET" build
          docker exec -w /home/mersdk/app electric-eel-build \
            mb2 --target "$SAILFISH_TARGET" check --suites harbour

          # Test-only dependency (QtTest headers), never an RPM requirement.
          docker exec electric-eel-build \
            sb2 -t "$SAILFISH_TARGET" -m sdk-install -R zypper --non-interactive in qt5-qttest-devel
          for test in phonekeyevents rustruntime; do
            docker exec -w /home/mersdk/app/tests electric-eel-build \
              sb2 -t "$SAILFISH_TARGET" qmake "$test.pro"
            docker exec -w /home/mersdk/app/tests electric-eel-build \
              sb2 -t "$SAILFISH_TARGET" make
            # Private session bus: phonekeyevents_test.cpp registers the
            # app's D-Bus name (Nemo.DBus publisher in PhoneKeyEvents.qml).
            docker exec -w /home/mersdk/app/tests electric-eel-build \
              sb2 -t "$SAILFISH_TARGET" dbus-run-session -- "./$test-test"
            docker exec -w /home/mersdk/app/tests electric-eel-build \
              sb2 -t "$SAILFISH_TARGET" make distclean
          done
