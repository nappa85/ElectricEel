[package]
name = "electric-eel-core"
version = "0.2.11"
edition = "2021"
description = "In-process BLE control core for harbour-electric-eel"

[lib]
name = "electriceelcore"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

# The `dbus` feature (only the electric-eel-daemon binary enables it) pulls
# in the zbus server + caller authorization. The app's staticlib builds with
# default (no) features so none of that machinery is linked into the app.
[features]
default = []
dbus = ["dep:zbus", "dep:procfs"]

[[bin]]
name = "electric-eel-daemon"
path = "src/main.rs"
required-features = ["dbus"]

[lints.clippy]
pedantic = "warn"

[dependencies]
procfs = { version = "0.18.0", default-features = false, optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
thiserror = "2"
wait-timeout = "0.2"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[build-dependencies]
cbindgen = "0.28"

[profile.release]
strip = true
lto = true
