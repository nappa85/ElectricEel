name: Build & publish RPM

# Builds the app RPM (harbour-electric-eel) exactly as documented in
# README.md and publishes it:
#   - on a `v*` tag push  -> attached to the GitHub release for that tag
#   - on workflow_dispatch -> uploaded as workflow artifacts (no release)
#
# Phase 4 end-state: the Rust control core is an in-process staticlib
# (aarch64 glibc) staged into the app tree by helper/make-app-bundle.sh,
# which also builds the Go tesla-session child that the core spawns. The app
# RPM is self-contained - there is no electric-eel-daemon helper package anymore
# (BLUEZ_BACKEND_PLAN.md).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'RPM version to build (e.g. 0.1.1). Leave empty to use the pushed tag.'
        required: false

permissions:
  contents: write

concurrency:
  group: rpm-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RPM
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space for the Sailfish SDK image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean
          df -h

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # helper/session/go.mod requires go >= 1.26.5
          go-version: '1.26.5'

      - name: Set up Rust (aarch64 glibc target for the in-app staticlib)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Compute RPM version
        id: version
        # The workflow_dispatch input is routed through an env var (not
        # interpolated straight into the run: script) so its contents are
        # never re-parsed by the shell - a value like "$(curl ...)" can't
        # inject commands. It's still strictly validated below before use.
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$RELEASE_VERSION" ]; then
            VER="$RELEASE_VERSION"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid version '$VER' (expected semver like 0.2.10)" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      # The app's APP_VERSION (from $${VERSION} in the .pro) and the
      # core's version (cargo package version, core_version()) are surfaced
      # on the Settings page and compared on the front page; stamp both from
      # the same tag so a matched pair always reports equal versions. This
      # must run BEFORE the bundle is staged so the staticlib's
      # core_version() carries the new tag.
      - name: Stamp app core build versions from the tag
        run: |
          sed -i "s/^VERSION =.*/VERSION = ${{ steps.version.outputs.version }}/" app/harbour-electric-eel.pro
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" helper/Cargo.toml
          grep '^VERSION =' app/harbour-electric-eel.pro
          grep '^version =' helper/Cargo.toml
          test "$(sed -n 's/^VERSION = //p' app/harbour-electric-eel.pro)" = \
               "$(sed -n 's/^version = "\(.*\)"/\1/p' helper/Cargo.toml)" \
            || { echo "app (.pro) and core (Cargo.toml) build versions diverged"; exit 1; }

      # Rust staticlib (aarch64 glibc - matches the app's Qt/Silica) + Go
      # tesla-session child, staged into app/thirdparty and app/bin. Nothing
      # here is committed to git (see .gitignore) - it is build output.
      - name: Stage the in-app core bundle (staticlib + tesla-session)
        run: |
          ./helper/make-app-bundle.sh

      - name: Stamp RPM version into the spec files
        run: |
          sed -i "s/^Version:.*/Version:       ${{ steps.version.outputs.version }}/" app/rpm/harbour-electric-eel.spec
          grep '^Version:' app/rpm/harbour-electric-eel.spec

      - name: Pull Sailfish Platform SDK
        run: docker pull coderus/sailfishos-platform-sdk-aarch64

      - name: Build the app RPM in the Sailfish SDK container
        run: |
          set -euxo pipefail
          docker create --name electric-eel-build coderus/sailfishos-platform-sdk-aarch64 sleep infinity
          docker start electric-eel-build
          trap 'docker rm -f electric-eel-build >/dev/null 2>&1 || true' EXIT

          # harbour-electric-eel.aarch64.rpm (staticlib + Go child staged by
          # make-app-bundle.sh ride along in app/thirdparty + app/bin)
          docker cp app electric-eel-build:/home/mersdk/app
          docker exec -u root electric-eel-build chown -R mersdk:mersdk /home/mersdk/app
          docker exec -w /home/mersdk/app electric-eel-build \
            mb2 --target SailfishOS-5.2.0.15-aarch64 build
          mkdir -p app/RPMS
          docker cp electric-eel-build:/home/mersdk/app/RPMS/. app/RPMS/

      - name: Sanity-check the built RPM
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm >/dev/null
          expected="${{ steps.version.outputs.version }}"
          found=0
          for f in app/RPMS/*.rpm; do
            [ -e "$f" ] || continue
            found=1
            echo "== $f =="
            rpm -qip "$f"
            ver="$(rpm -qp --qf '%{VERSION}' "$f")"
            arch="$(rpm -qp --qf '%{ARCH}' "$f")"
            [ "$arch" = "aarch64" ] || { echo "wrong arch '$arch' for $f (expected aarch64)"; exit 1; }
            [ "$ver" = "$expected" ] || { echo "version '$ver' != expected '$expected' for $f"; exit 1; }
          done
          [ "$found" -eq 1 ] || { echo "no RPMs produced"; exit 1; }

      - name: Publish RPM to the tag release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/RPMS/*.rpm
          generate_release_notes: true
          make_latest: true

      - name: Upload RPM as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ steps.version.outputs.version }}
          path: |
            app/RPMS/*.rpm
