[package]
name = "electric-eel-core"
version = "0.3.9"
edition = "2021"
rust-version = "1.99"
description = "In-process BLE control core for harbour-electric-eel"

[lib]
name = "electriceelcore"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

# The app uses zbus only as an MCE (CPU keepalive) client.
[features]
default = []
app-entry = ["runtime"]
runtime = ["dep:zbus"]

[lints.clippy]
pedantic = "warn"

[dependencies]
async-channel = "2"
async-io = "2"
async-lock = "3"
futures-lite = "2"
regex = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2"
libc = "0.2"
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[build-dependencies]
cbindgen = "0.28"

[profile.release]
strip = true
lto = true
